<script>
/* ================= FEEDBACK — goes straight to the developer (Netlify Forms) ================= */
var FB_ENDPOINT='https://nexus-grid-xuzj.netlify.app/';   // Netlify accepts form posts at any path on the site
function fbContext(){
  var where=window.NexusNative?'android-app':isInstalled()?'installed-web':/netlify\.app$/.test(location.hostname)?'web':location.protocol==='file:'?'local-file':location.hostname||'unknown';
  return 'v7.1 · '+where+' · '+innerWidth+'x'+innerHeight+' · '+(navigator.userAgent||'').replace(/\s+/g,' ').slice(0,160);
}
function fbSend(data){
  var body=new URLSearchParams(Object.assign({'form-name':'feedback','bot-field':''},data)).toString();
  // no-cors: a plain form post that works from the website, the installed app and the Android app alike.
  // The response can't be read cross-origin, so a network failure is the only error we can detect.
  return fetch(FB_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body});
}
APPS.feedback={name:'Feedback',icon:'',cat:'You',w:460,h:620,
 render:function(b){
   var rating=0;
   b.innerHTML='<h3 class="h">SEND FEEDBACK</h3><div class="sub">this goes straight to the developer · bugs, ideas, anything</div>'+
     '<div class="card"><h4><span>HOW IS IT SO FAR?</span><span class="mu" id="fbRateTxt">tap a number</span></h4><div class="fbrate" id="fbRate"></div></div>'+
     '<div class="card"><h4><span>WHAT’S IT ABOUT?</span></h4><div class="tabs" id="fbType" style="margin:0">'+
       ['bug','idea','confusing','praise'].map(function(t,i){return '<button class="tab'+(i?'':' on')+'" type="button" data-t="'+t+'">'+t.toUpperCase()+'</button>'}).join('')+'</div></div>'+
     '<div class="col"><textarea class="in" id="fbMsg" maxlength="2000" placeholder="what happened, or what would make NEXUS better?" style="min-height:120px"></textarea>'+
     '<input class="in" id="fbUse" maxlength="120" placeholder="which part would you come back for? (optional)">'+
     '<input class="in" id="fbContact" maxlength="120" placeholder="email or @handle if you want a reply (optional)">'+
     '<label class="mu" style="display:flex;align-items:center;gap:10px;font-size:11px;margin:0;cursor:pointer;line-height:1.5"><input type="checkbox" id="fbDev" checked style="flex:none;width:18px;height:18px"> include device info (app version, screen size, browser)</label>'+
     '<button class="btn pri" id="fbGo" type="button" style="width:100%;padding:13px">SEND</button>'+
     '<div class="mu" id="fbNote" style="font-size:10.5px;line-height:1.6">Only what you type here is sent, plus device info if ticked. Your notes, XP and profile are never sent.</div></div>';
   var rr=$('#fbRate',b),labels=['','rough','meh','ok','good','love it'];
   [1,2,3,4,5].forEach(function(n){var x=el('button','',String(n));x.type='button';x.setAttribute('aria-label','rate '+n+' of 5');
     x.onclick=function(){rating=n;$$('button',rr).forEach(function(y,i){y.classList.toggle('on',i<n)});$('#fbRateTxt',b).textContent=n+' / 5 · '+labels[n]};rr.appendChild(x)});
   $$('#fbType .tab',b).forEach(function(t){t.onclick=function(){$$('#fbType .tab',b).forEach(function(x){x.classList.remove('on')});t.classList.add('on')}});
   $('#fbGo',b).onclick=function(){
     var msg=$('#fbMsg',b).value.trim(),go=this;
     if(!msg&&!rating)return toast('add a rating or a message first');
     var last=+LS.get('grid:fbLast')||0;if(now()-last<30000)return toast('sent just now — give it a few seconds');
     go.disabled=true;go.textContent='SENDING…';
     fbSend({rating:rating?String(rating):'',type:$('#fbType .tab.on',b).dataset.t,message:msg,comeback:$('#fbUse',b).value.trim(),
       contact:$('#fbContact',b).value.trim(),handle:ME.handle,device:$('#fbDev',b).checked?fbContext():''})
     .then(function(){
       LS.set('grid:fbLast',String(now()));
       b.innerHTML='<div class="empty" style="margin-top:20px">feedback sent — thank you.<br>the developer reads every one.</div><button class="btn ghost" id="fbMore" type="button" style="width:100%;margin-top:12px">send another</button>';
       $('#fbMore',b).onclick=function(){APPS.feedback.render(b)};
       addXP(10,'sent feedback');
     },function(){
       go.disabled=false;go.textContent='SEND';
       toast('could not send — are you offline?');
       $('#fbNote',b).innerHTML='Couldn’t reach the server. Your text is still here; try again when you’re online, or open an issue on <a href="https://github.com/Lotusborn19/nexus-grid/issues" target="_blank" rel="noopener">GitHub</a>.';
     });
   };
 }};
APP_ORDER.push('feedback');
</script>
