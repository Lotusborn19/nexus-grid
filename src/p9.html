<script>
/* ================= GAME ROOM (trivia + hacking sim + leaderboard) ================= */
var TRIVIA=[
 {q:'What does HTTPS add over HTTP?',a:['Faster images','Encryption in transit','More ads'],c:1},
 {q:'A Wi-Fi/TLS "handshake" is…',a:['A greeting emoji','The key-exchange that sets up a session','A type of cable'],c:1},
 {q:'Strongest password habit?',a:['Reuse one everywhere','A unique passphrase + 2FA','Your pet’s name'],c:1},
 {q:'What is phishing?',a:['A network scan','Tricking people into giving up secrets','A sorting algorithm'],c:1},
 {q:'Base64 is…',a:['Encryption','An encoding (not secret)','A password'],c:1},
 {q:'What does a firewall do?',a:['Cools the CPU','Filters network traffic by rules','Stores files'],c:1},
 {q:'RAM is…',a:['Permanent storage','Fast temporary working memory','A CPU brand'],c:1},
 {q:'Which language leads AI/ML work?',a:['COBOL','Python','HTML'],c:1},
 {q:'An IP address is…',a:['A phone number','A device’s address on a network','A password hash'],c:1},
 {q:'Open-source means…',a:['Free of bugs','Source code is public to read/modify','Made by one company'],c:1},
 {q:'A VPN mainly…',a:['Speeds up your GPU','Encrypts & reroutes your traffic','Blocks all ads'],c:1},
 {q:'git is used for…',a:['Editing photos','Version control for code','Running servers'],c:1},
 {q:'nmap is a tool for…',a:['Drawing maps','Scanning networks/ports','Making music'],c:1},
 {q:'Which is PII?',a:['A public meme','Your social-security number','A weather report'],c:1},
 {q:'A "zero-day" is…',a:['A free trial','An unknown, unpatched vulnerability','A calendar app'],c:1},
 {q:'ESP32 is…',a:['A GPU','A Wi-Fi/BT microcontroller','A monitor'],c:1},
 {q:'Which keeps you legal while learning?',a:['Scan any network','Only test systems you own/are authorised','Just hide your IP'],c:1},
 {q:'DNS translates…',a:['Code to binary','Domain names to IP addresses','Images to text'],c:1},
 {q:'The "C" in CPU is…',a:['Central','Compute','Core'],c:0},
 {q:'Which is a safe lab to practice on?',a:['A bank’s site','TryHackMe / your own VM','A stranger’s router'],c:1}
];

var GAME_TAB='arcade';
APPS.games={name:'Arcade',icon:'🕹️',cat:'Play',w:560,h:600,
 render:function(b){
   b.innerHTML='<h3 class="h">ARCADE</h3><div class="sub">play for XP · climb the GRID leaderboard · friendly competition</div><div class="tabs" id="gmTabs"></div><div id="gmBody"></div>';
   var tabs=[['arcade','▸ GAMES'],['leader','▸ LEADERBOARD']];
   var tb=$('#gmTabs',b);tabs.forEach(function(t){var bn=el('button','tab'+(t[0]===GAME_TAB?' on':''),t[1]);bn.type='button';bn.onclick=function(){GAME_TAB=t[0];$$('#gmTabs .tab',b).forEach(function(x){x.classList.remove('on')});bn.classList.add('on');gmRender(b)};tb.appendChild(bn)});
   gmRender(b);
 },onClose:function(){if(gamesState.lbSub){try{gamesState.lbSub()}catch(e){}gamesState.lbSub=null}}};
var gamesState={lbSub:null};
function gmRender(b){
  var body=$('#gmBody',b);if(!body)return;
  if(gamesState.lbSub){try{gamesState.lbSub()}catch(e){}gamesState.lbSub=null}
  if(GAME_TAB==='leader'){lbRenderInto(body);return}
  body.innerHTML='<div class="grid2" id="gmGrid"></div>';
  var g=$('#gmGrid',body);
  GAMES.forEach(function(gm){var best=LS.j('grid:best:'+gm.id,0);
    var card=el('button','course');card.type='button';
    card.innerHTML='<div class="tile-ic">'+gm.ic+'</div><div class="ttl">'+esc(gm.t)+'</div><div class="mu" style="font-size:11px;flex:1">'+esc(gm.d)+'</div><div class="row" style="justify-content:space-between"><span class="tag a">best '+best+'</span><span class="tag c">play</span></div>';
    card.onclick=function(){gm.play(body,b)};g.appendChild(card);
  });
  var tip=el('div','note');tip.style.marginTop='12px';tip.innerHTML='Every win earns XP that feeds your rank and the leaderboard. Beat your friends. #Hack_The_World';
  body.appendChild(tip);
}
var GAMES=[
 {id:'trivia',ic:'🧠',t:'Trivia Gauntlet',d:'10 timed tech & cyber questions. Answer streaks multiply your XP.',play:playTrivia},
 {id:'breach',ic:'🔓',t:'Cipher Breach',d:'Crack the 4-digit vault PIN from logic feedback. Fewer tries = more XP.',play:playBreach}
];

/* ---- Trivia Gauntlet ---- */
function playTrivia(body,b){
  var pool=TRIVIA.slice().sort(function(){return Math.random()-0.5}).slice(0,10),i=0,score=0,streak=0,xp=0,timer=null,tleft=12;
  function stop(){if(timer){clearInterval(timer);timer=null}}
  function next(ok){stop();if(ok){score++;streak++;xp+=5+Math.min(12,(streak-1)*2)}else{streak=0}i++;ask()}
  function ask(){
    if(!body.isConnected){stop();return}
    if(i>=pool.length)return done();
    var src=pool[i],order=src.a.map(function(t,j){return{t:t,ok:j===src.c}}).sort(function(){return Math.random()-0.5}),
        it={q:src.q,a:order.map(function(o){return o.t}),c:order.map(function(o){return o.ok}).indexOf(true)};tleft=12;
    body.innerHTML='<button class="btn ghost sm" id="tvBack" type="button">◄ arcade</button>'+
      '<div class="row" style="justify-content:space-between;margin:10px 0"><b>Q'+(i+1)+'/10</b><span class="am" id="tvT">'+tleft+'s</span><span class="ok">streak ×'+streak+'</span></div>'+
      '<h3 class="h" style="font-size:15px">'+esc(it.q)+'</h3><div class="col" id="tvOpts" style="margin-top:12px"></div>';
    $('#tvBack',body).onclick=function(){stop();gmRender(b)};
    var opts=$('#tvOpts',body);
    it.a.forEach(function(opt,j){var bn=el('button','btn ghost');bn.type='button';bn.style.textAlign='left';bn.textContent=opt;
      bn.onclick=function(){stop();$$('#tvOpts button',body).forEach(function(x){x.disabled=true});
        bn.classList.add(j===it.c?'pri':'warn');sfx(j===it.c?'ok':'bad');if(j!==it.c){var cc=$$('#tvOpts button',body)[it.c];if(cc)cc.classList.add('pri')}
        setTimeout(function(){next(j===it.c)},520)};
      opts.appendChild(bn)});
    timer=setInterval(function(){tleft--;var t=$('#tvT',body);if(!body.isConnected){stop();return}if(t)t.textContent=tleft+'s';if(tleft<=0){stop();$$('#tvOpts button',body).forEach(function(x){x.disabled=true});next(false)}},1000);
  }
  function done(){stop();
    var best=LS.j('grid:best:trivia',0);if(score>best){LS.sj('grid:best:trivia',score);best=score}
    if(xp>0)addXP(xp,'trivia gauntlet');if(score>=6){bumpQuest('play');GE('win')}
    body.innerHTML='<h3 class="h">GAUNTLET COMPLETE</h3><div class="card" style="text-align:center"><div class="big" style="font-size:40px;color:var(--green)">'+score+'/10</div><div class="mu">+'+xp+' XP earned · best '+best+'</div></div>'+
      '<div class="row"><button class="btn pri" id="tvAgain" type="button">play again</button><button class="btn ghost" id="tvLead" type="button">leaderboard</button><button class="btn ghost" id="tvBack2" type="button">arcade</button></div>';
    $('#tvAgain',body).onclick=function(){playTrivia(body,b)};
    $('#tvBack2',body).onclick=function(){gmRender(b)};
    $('#tvLead',body).onclick=function(){GAME_TAB='leader';APPS.games.render(b);};
  }
  ask();
}

/* ---- Cipher Breach (hacking sim: crack the PIN) ---- */
function playBreach(body,b){
  var pin=[];while(pin.length<4){var d=''+(Math.random()*10|0);if(pin.indexOf(d)<0)pin.push(d)}pin=pin.join('');
  var tries=8,hist=[],over=false;
  function feedback(g){var locked=0,loose=0;for(var k=0;k<4;k++){if(g[k]===pin[k])locked++;else if(pin.indexOf(g[k])>=0)loose++;}return{locked:locked,loose:loose}}
  function guess(v){
    if(over)return;
    var f=feedback(v);hist.unshift({g:v,f:f});tries--;
    if(f.locked===4){over=true;win();return}
    if(tries<=0){over=true;lose();return}
    draw();
  }
  function win(){
    var xp=20+tries*3;   // base 20 + 3 per attempt left
    var best=LS.j('grid:best:breach',0);if(xp>best)LS.sj('grid:best:breach',xp);
    addXP(xp,'cipher breach');bumpQuest('play');GE('win');sfx('ok');
    body.innerHTML='<h3 class="h ok">ACCESS GRANTED</h3><div class="card" style="text-align:center"><div class="big" style="font-size:38px;color:var(--green)">'+pin+'</div><div class="mu">cracked with '+tries+' tries to spare · +'+xp+' XP</div></div><div class="row"><button class="btn pri" id="bbAgain" type="button">new vault</button><button class="btn ghost" id="bbBack2" type="button">arcade</button></div>';
    $('#bbAgain',body).onclick=function(){playBreach(body,b)};$('#bbBack2',body).onclick=function(){gmRender(b)};
  }
  function lose(){
    sfx('bad');
    body.innerHTML='<h3 class="h bad">LOCKOUT</h3><div class="card" style="text-align:center"><div class="mu">the PIN was</div><div class="big" style="font-size:38px;color:var(--red)">'+pin+'</div></div><div class="row"><button class="btn pri" id="bbAgain" type="button">try again</button><button class="btn ghost" id="bbBack2" type="button">arcade</button></div>';
    $('#bbAgain',body).onclick=function(){playBreach(body,b)};$('#bbBack2',body).onclick=function(){gmRender(b)};
  }
  function draw(){
    body.innerHTML='<button class="btn ghost sm" id="bbBack" type="button">◄ arcade</button>'+
      '<h3 class="h" style="font-size:15px;margin-top:8px">CIPHER BREACH</h3>'+
      '<div class="sub">Crack the 4-digit PIN (unique digits). <b class="ok">LOCKED</b> = right digit, right spot · <b class="am">LOOSE</b> = right digit, wrong spot.</div>'+
      '<div class="row"><input class="in" id="bbIn" maxlength="4" inputmode="numeric" placeholder="4 digits" style="flex:1;letter-spacing:6px;font-size:18px;text-align:center"><button class="btn pri" id="bbGo" type="button">BREACH</button></div>'+
      '<div class="mu" style="font-size:11px;margin:8px 0">attempts left: <b class="ok">'+tries+'</b></div><div class="col" id="bbHist"></div>';
    $('#bbBack',body).onclick=function(){gmRender(b)};
    var go=function(){var v=($('#bbIn',body).value||'').trim();if(!/^\d{4}$/.test(v))return toast('enter exactly 4 digits');if(new Set(v.split('')).size!==4)return toast('use 4 different digits');guess(v)};
    $('#bbGo',body).onclick=go;var inp=$('#bbIn',body);inp.addEventListener('keydown',function(e){if(e.key==='Enter')go()});inp.focus();
    var h=$('#bbHist',body);
    hist.forEach(function(r){var row=el('div','lb');row.style.borderBottom='1px dashed var(--deep)';
      row.innerHTML='<b style="letter-spacing:4px;font-size:15px">'+esc(r.g)+'</b><span class="ok" style="margin-left:auto">● '+r.f.locked+' LOCKED</span><span class="am">○ '+r.f.loose+' LOOSE</span>';h.appendChild(row)});
  }
  draw();
}

/* ================= LEADERBOARD ================= */
var _lbT=null;
function lbPush(immediate){
  if(!(CAP.db&&CAP.me&&CAP.me.id))return;
  var go=function(){try{CAP.db.collection('scores').doc(CAP.me.id).set({handle:ME.handle,xp:ME.xp,rank:rankOf(ME.xp)[0],color:ME.color,t:now()}).catch(function(){})}catch(e){}};
  clearTimeout(_lbT);if(immediate)go();else _lbT=setTimeout(go,1500);
}
function lbLocalRows(){
  return [{id:'me',h:ME.handle,xp:ME.xp,color:ME.color,me:true}];   // offline there is exactly one real operator: you
}
function lbRenderInto(box){
  box.innerHTML='<div class="mu" style="font-size:11px;margin-bottom:8px">'+(CAP.db?'live GRID ranking — real operators + you':'offline — only you are on this board. real operators appear when the GRID is live')+'</div><div id="lbList"></div><div class="card" style="margin-top:14px"><h4><span>YOUR RECORDS</span><span class="mu">this device</span></h4><div class="recs" id="lbRecs"></div></div>';
  var st=meStats(),recs=[['ARCADE WINS',st.wins],['SIGNAL LOCK',LS.j('grid:best:signal',0)+' pts'],['TRACE ROUTE',LS.j('grid:best:trace',0)+' hops'],['BINARY BLITZ',LS.j('grid:best:blitz',0)+' solved'],['FLAGS',st.flags],['BEST STREAK',Math.max(ME.bestStreak||0,ME.streak||0)+' d']];
  $('#lbRecs',box).innerHTML=recs.map(function(r){return '<div><span>'+r[0]+'</span><b>'+r[1]+'</b></div>'}).join('');
  var list=$('#lbList',box);
  if(CAP.db&&CAP.me){
    lbPush(true);
    try{gamesState.lbSub=CAP.db.collection('scores').orderBy('xp','desc').limit(30).onSnapshot(function(snap){
      var rows=snap.docs.filter(function(d){if(/^npc\d+$/.test(d.id)){dbDrop('scores',d.id);return false}return true})
        .map(function(d){var x=d.data();return{id:d.id,h:x.handle||'anon',xp:x.xp||0,color:x.color||'#00ff7b',me:d.id===CAP.me.id}});
      lbPaint(list,rows);
    },function(){lbPaint(list,lbLocalRows())})}catch(e){lbPaint(list,lbLocalRows())}
  }else{lbPaint(list,lbLocalRows())}
}
function lbPaint(list,rows){
  rows=rows.slice().sort(function(a,b){return b.xp-a.xp});
  var medal=['01','02','03'];
  list.innerHTML='';
  rows.forEach(function(r,i){
    var row=el('div','lb');if(r.me)row.style.background='var(--deep)';if(i<3)row.classList.add('podium');
    row.style.padding='8px 6px';
    row.innerHTML='<span class="pos">'+(medal[i]||(i+1))+'</span>'+avatar(r.h,r.color)+
      '<div style="min-width:0"><b class="handle">@'+esc(r.h)+(r.me?' <span class="tag c">you</span>':'')+'</b><div class="rank">⬡ '+rankOf(r.xp)[0].replace('_',' ')+'</div></div>'+
      '<b class="ok" style="margin-left:auto">'+r.xp+' XP</b>';
    list.appendChild(row);
  });
  if(!rows.length)list.innerHTML='<div class="empty">no operators ranked yet</div>';
}
</script>
<script>
/* ================= SUGGESTION BOX (community ideas + upvotes) ================= */
function anonId(){var a=LS.get('grid:anon');if(!a){a='anon_'+Math.random().toString(36).slice(2,10);LS.set('grid:anon',a)}return a}
function myVoterId(){return (CAP.me&&CAP.me.id)||anonId()}
var SUG_SEED_IDS={s_ctf_weekly:1,s_feed_img:1,s_themes:1,s_voice:1};
function sugLocal(){return LS.j('grid:sug',[])}
function sugSaveLocal(x){LS.sj('grid:sug',x)}
var sugState={items:null,sub:null,sort:'top'};
APPS.suggest={name:'Ideas',icon:'💡',cat:'Social',w:560,h:600,
 render:function(b){
   b.innerHTML='<h3 class="h">SUGGESTION BOX</h3><div class="sub">pitch an improvement · vote on ideas · the best rise to the top</div><div class="localnote">LOCAL MODE · saved on this device only. Nobody else sees this until the GRID is live.</div>'+
     '<div class="composer"><textarea class="in" id="sugTxt" placeholder="your idea to make NEXUS better…"></textarea><div class="row" style="justify-content:flex-end"><button class="btn pri" id="sugPost" type="button">submit idea</button></div></div>'+
     '<div class="tabs" id="sugSort"><button class="tab on" data-s="top" type="button">▲ TOP VOTED</button><button class="tab" data-s="new" type="button">◷ NEWEST</button></div>'+
     '<div class="col" id="sugList" style="margin-top:2px"></div>';
   $('#sugPost',b).onclick=function(){var t=$('#sugTxt',b).value.trim();if(!t)return toast('type an idea first');
     var s={id:'u'+now().toString(36),h:ME.handle,txt:t,base:0,voters:[myVoterId()],t:now(),status:'open'};
     sugAdd(s);$('#sugTxt',b).value='';addXP(5,'suggested an idea')};
   $$('#sugSort .tab',b).forEach(function(bn){bn.onclick=function(){$$('#sugSort .tab',b).forEach(function(x){x.classList.remove('on')});bn.classList.add('on');sugState.sort=bn.dataset.s;sugRender()}});
   sugState.sort='top';sugSub();
 },onClose:function(){if(sugState.sub){try{sugState.sub()}catch(e){}sugState.sub=null}}};
function sugVotes(s){return (s.base||0)+((s.voters||[]).length)}
function sugVoted(s){return (s.voters||[]).indexOf(myVoterId())>=0}
function sugAdd(s){
  if(CAP.db){CAP.db.collection('suggestions').doc(s.id).set(s).catch(function(){})}
  else{var x=sugLocal();x.unshift(s);sugSaveLocal(x);sugState.items=x;sugRender()}
}
function sugToggleVote(s){
  var id=myVoterId(),v=(s.voters||[]).slice(),k=v.indexOf(id);
  if(k>=0)v.splice(k,1);else{v.push(id);addXP(1,'')}
  s.voters=v;
  if(CAP.db){CAP.db.collection('suggestions').doc(s.id).set(s).catch(function(){})}
  else{var x=(sugState.items||sugLocal()).map(function(i){return i.id===s.id?s:i});sugSaveLocal(x);sugState.items=x;sugRender()}
}
function sugSub(){
  if(CAP.db){
    if(sugState.sub)return;
    try{sugState.sub=CAP.db.collection('suggestions').orderBy('t','desc').limit(80).onSnapshot(function(snap){
      var items=snap.docs.map(function(d){return d.data()}).filter(function(s){if(SUG_SEED_IDS[s.id]){dbDrop('suggestions',s.id);return false}return true});
      sugState.items=items;sugRender();
    },function(){sugState.items=sugLocal();sugRender()})}catch(e){sugState.items=sugLocal();sugRender()}
  }else{sugState.items=sugLocal();sugRender()}
}
function sugRender(){
  var list=$('#sugList');if(!list)return;
  var items=(sugState.items||sugLocal()).slice();
  if(sugState.sort==='top')items.sort(function(a,b){return sugVotes(b)-sugVotes(a)});
  else items.sort(function(a,b){return b.t-a.t});
  var stCol={open:'',planned:'c',done:'a'};
  list.innerHTML='';
  if(!items.length){list.innerHTML='<div class="empty">no ideas yet — be the first to pitch one</div>';return}
  items.forEach(function(s){
    var voted=sugVoted(s),node=el('div','post');
    node.innerHTML='<div class="row" style="align-items:flex-start;gap:10px">'+
      '<button class="votebtn'+(voted?' on':'')+'" type="button" aria-label="upvote"><span>▲</span><b>'+sugVotes(s)+'</b></button>'+
      '<div style="flex:1;min-width:0"><div class="bodytxt">'+md(s.txt)+'</div>'+
      '<div class="when">@'+esc(s.h)+' · '+ago(s.t)+' <span class="tag '+(stCol[s.status]||'')+'">'+esc((s.status||'open').toUpperCase())+'</span></div></div></div>';
    $('.votebtn',node).onclick=function(){sugToggleVote(s)};
    list.appendChild(node);
  });
}
</script>
<script>
/* ================= PROFILE WALL (MySpace/Facebook-style guestbook) ================= */
var MOODS=['🟢','😎','🔥','👾','💻','🕶️','⚡','🧠','☕','🌙','🏴‍☠️','🤖'];
function wallOwnerId(){return (CAP.me&&CAP.me.id)||('local_'+ME.handle)}
function wallLocal(){return LS.j('grid:wall',[])}
function wallSaveLocal(x){LS.sj('grid:wall',x)}
var wallState={items:null,sub:null};
function wallAdd(m){
  if(CAP.db){CAP.db.collection('wall').doc(m.id).set(m).catch(function(){})}
  else{var x=wallLocal();x.unshift(m);wallSaveLocal(x);wallState.items=x;wallRender()}
}
function wallSub(){
  if(CAP.db&&CAP.me){
    if(wallState.sub){try{wallState.sub()}catch(e){}wallState.sub=null}
    try{wallState.sub=CAP.db.collection('wall').orderBy('t','desc').limit(60).onSnapshot(function(snap){
      var all=snap.docs.map(function(d){return d.data()}).filter(function(m){if(/^w_(tom|cipher)_/.test(m.id||'')){dbDrop('wall',m.id);return false}return true});
      var mine=all.filter(function(m){return m.owner===wallOwnerId()});
      wallState.items=mine;wallRender();
    },function(){wallState.items=wallLocal();wallRender()})}catch(e){wallState.items=wallLocal();wallRender()}
  }else{wallState.items=wallLocal();wallRender()}
}
function wallRender(){
  var box=$('#pfWall');if(!box)return;
  var items=(wallState.items||wallLocal()).slice().sort(function(a,b){return b.t-a.t});
  box.innerHTML='';
  if(!items.length){box.innerHTML='<div class="empty">no wall posts yet — your friends’ messages show up here</div>';return}
  items.forEach(function(m){box.appendChild(el('div','wallmsg','<div class="row" style="gap:8px;align-items:center">'+avatar(m.from,m.color)+'<b class="handle">@'+esc(m.from)+'</b><span class="when" style="margin-left:auto">'+ago(m.t)+'</span></div><div class="bodytxt" style="margin-top:5px">'+md(m.txt)+'</div>'))});
}
<script>
/* ================= apply crafted icons to apps + content (called from start, after all apps exist) ================= */
function applyIcons(){
  var AI={feedback:'chat',algo:'bars',feed:'feed',flash:'flash',crews:'crews',suggest:'suggest',academy:'academy',blueprint:'blueprint',games:'games',sandbox:'sandbox',control:'control',automate:'timer',shell:'shell',system:'pulse',bridge:'plug',profile:'profile',friends:'friends',news:'news',market:'market',ai:'companion',notes:'notes',codex:'code',guard:'guard',settings:'settings'};
  Object.keys(AI).forEach(function(id){if(APPS[id])APPS[id].icon=ic(AI[id])});
  var CI={cs:'code',termux:'termux',web:'web',gamedev:'gamedev',robotics:'robot',promptai:'ai',computers:'computer',linux:'termux',python:'code',coding:'code',ai:'ai',pcbuild:'computer',electrical:'electrical',content:'media',video:'media',unreal:'unreal'};
  if(typeof COURSES!=='undefined')COURSES.forEach(function(c){c.ic=ic(CI[c.id]||'academy','ic-lg')});
  if(typeof GAMES!=='undefined')GAMES.forEach(function(g){g.ic=ic({trivia:'ai',breach:'crypto',signal:'target',trace:'nodes',blitz:'computer'}[g.id]||'games','ic-lg')});
  if(typeof MARKET!=='undefined')MARKET.forEach(function(m){var t=(m.t||'').toLowerCase(),k='market';
    if(/termux|pocket linux/.test(t))k='termux';else if(/security|toolkit/.test(t))k='guard';else if(/theme/.test(t))k='theme';
    else if(/firmware|esp32/.test(t))k='robot';else if(/bounty/.test(t))k='bounty';else if(/prompt ai/.test(t))k='ai';else if(/tech book/.test(t))k='academy';
    m.ic=ic(k,'ic-xl')});
}
</script>
