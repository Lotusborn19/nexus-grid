<script>
/* ================= window manager ================= */
var isMobile=function(){return innerWidth<820};
if(isMobile())document.body.classList.add('mobile');
addEventListener('resize',function(){document.body.classList.toggle('mobile',isMobile())});

var openApps={},zTop=200,winSeed=0;
function focusWin(w){w.style.zIndex=++zTop;$$('#tasks .ti').forEach(function(t){t.classList.toggle('on',t.dataset.app===w.dataset.app)})}

function openApp(id){
  var a=APPS[id];if(!a)return;
  hideStart();
  if(openApps[id]){var w=openApps[id];w.hidden=false;focusWin(w);if(a.onFocus)a.onFocus(w);return}
  var w=el('section','win');w.dataset.app=id;w.setAttribute('role','dialog');w.setAttribute('aria-label',a.name);
  if(isMobile())w.classList.add('max');
  else{var n=winSeed++;w.style.left=(24+n*26%180)+'px';w.style.top=(20+n*24%120)+'px';
    w.style.width=Math.min(a.w||560,innerWidth-40)+'px';w.style.height=Math.min(a.h||520,innerHeight-120)+'px'}
  w.innerHTML='<div class="tb"><span class="t">'+a.icon+' <span class="tn">'+esc(a.name)+'</span><span class="tpath">nexus://'+esc(id)+'</span></span>'+
    '<button class="wb mx" type="button" data-w="max" aria-label="Maximize">▢</button>'+
    '<button class="wb x" type="button" data-w="close" aria-label="Close">✕</button></div>'+
    '<div class="wbody'+(a.flush?' flush':'')+'"></div><div class="grip"></div>';
  document.body.appendChild(w);openApps[id]=w;focusWin(w);
  if(typeof scramble==='function')scramble($('.tn',w),a.name);
  var body=$('.wbody',w);
  try{a.render(body,w)}catch(e){body.innerHTML='<div class="note">app error: '+esc(e.message)+'</div>';}
  wireWin(w,id,a);addTaskItem(id,a);refreshOps();
}
function closeApp(id){var w=openApps[id];if(!w)return;if(APPS[id].onClose)try{APPS[id].onClose()}catch(e){}
  w.remove();delete openApps[id];var t=$('#tasks .ti[data-app="'+id+'"]');if(t)t.remove();refreshOps()}
function wireWin(w,id,a){
  w.addEventListener('mousedown',function(){focusWin(w)},true);
  w.addEventListener('touchstart',function(){focusWin(w)},{passive:true,capture:true});
  $('.wb.x',w).onclick=function(){closeApp(id)};
  $('.wb.mx',w).onclick=function(){w.classList.toggle('max')};
  if(!isMobile()){dragEl($('.tb',w),w);resizeEl($('.grip',w),w)}
}
function addTaskItem(id,a){if($('#tasks .ti[data-app="'+id+'"]'))return;
  var t=el('button','ti on',a.icon+' '+a.name);t.dataset.app=id;t.type='button';
  t.onclick=function(){var w=openApps[id];if(!w)return;if(w.hidden){w.hidden=false;focusWin(w)}else focusWin(w)};
  $('#tasks').appendChild(t)}
function refreshOps(){$('#tOps').textContent=Object.keys(openApps).length}

function dragEl(handle,w){var sx,sy,ox,oy,on=false;
  handle.addEventListener('mousedown',start);handle.addEventListener('touchstart',start,{passive:false});
  function start(e){if(w.classList.contains('max'))return;if(e.target.closest('.wb'))return;on=true;var p=pt(e);sx=p.x;sy=p.y;ox=w.offsetLeft;oy=w.offsetTop;
    document.addEventListener('mousemove',mv);document.addEventListener('touchmove',mv,{passive:false});
    document.addEventListener('mouseup',up);document.addEventListener('touchend',up);e.preventDefault()}
  function mv(e){if(!on)return;var p=pt(e);w.style.left=Math.max(0,Math.min(innerWidth-60,ox+p.x-sx))+'px';w.style.top=Math.max(36,Math.min(innerHeight-60,oy+p.y-sy))+'px';e.preventDefault()}
  function up(){on=false;document.removeEventListener('mousemove',mv);document.removeEventListener('touchmove',mv);document.removeEventListener('mouseup',up);document.removeEventListener('touchend',up)}
}
function resizeEl(grip,w){var sx,sy,ow,oh,on=false;
  grip.addEventListener('mousedown',start);grip.addEventListener('touchstart',start,{passive:false});
  function start(e){on=true;var p=pt(e);sx=p.x;sy=p.y;ow=w.offsetWidth;oh=w.offsetHeight;
    document.addEventListener('mousemove',mv);document.addEventListener('touchmove',mv,{passive:false});
    document.addEventListener('mouseup',up);document.addEventListener('touchend',up);e.preventDefault();e.stopPropagation()}
  function mv(e){if(!on)return;var p=pt(e);w.style.width=Math.max(280,ow+p.x-sx)+'px';w.style.height=Math.max(220,oh+p.y-sy)+'px';e.preventDefault()}
  function up(){on=false;document.removeEventListener('mousemove',mv);document.removeEventListener('touchmove',mv);document.removeEventListener('mouseup',up);document.removeEventListener('touchend',up)}
}
function pt(e){var t=e.touches&&e.touches[0];return{x:t?t.clientX:e.clientX,y:t?t.clientY:e.clientY}}

/* ================= desktop + start menu ================= */
function paintDesktop(){
  var box=$('#icons');box.innerHTML='';
  var cats=[],by={};
  APP_ORDER.forEach(function(id){var c=APPS[id].cat;if(!by[c]){by[c]=[];cats.push(c)}by[c].push(id)});
  cats.forEach(function(c){
    var g=el('div','igroup');g.innerHTML='<div class="ilabel"><span>'+esc(c.toUpperCase())+'</span><i></i><em>'+pad(by[c].length)+'</em></div>';
    var grid=el('div','icons');
    by[c].forEach(function(id){var a=APPS[id];
      var b=el('button','ic');b.type='button';b.dataset.open=id;
      b.innerHTML='<span class="g">'+a.icon+(a.badge?'<span class="dot">'+a.badge+'</span>':'')+'</span><span class="n">'+esc(a.name)+'</span>';
      grid.appendChild(b)});
    g.appendChild(grid);box.appendChild(g)});
}
document.addEventListener('click',function(e){var o=e.target.closest('[data-open]');if(o){openApp(o.dataset.open)}});

var startOpen=false;
function showStart(){startOpen=true;$('#start').hidden=false;paintStart('');$('#startq').value='';setTimeout(function(){$('#startq').focus()},30)}
function hideStart(){startOpen=false;$('#start').hidden=true}
$('#startbtn').onclick=function(){startOpen?hideStart():showStart()};
document.addEventListener('click',function(e){if(startOpen&&!e.target.closest('#start')&&!e.target.closest('#startbtn'))hideStart()});
$('#startq').addEventListener('input',function(){paintStart(this.value)});
function paintStart(q){
  q=q.toLowerCase();var byCat={},list=$('#smlist');list.innerHTML='';
  APP_ORDER.forEach(function(id){var a=APPS[id];if(q&&a.name.toLowerCase().indexOf(q)<0&&a.cat.toLowerCase().indexOf(q)<0)return;(byCat[a.cat]=byCat[a.cat]||[]).push(id)});
  Object.keys(byCat).forEach(function(cat){
    list.appendChild(el('div','smc',cat.toUpperCase()));
    byCat[cat].forEach(function(id){var a=APPS[id];
      var b=el('button','smi','<span>'+a.icon+'</span><span>'+esc(a.name)+'</span>');b.type='button';
      b.onclick=function(){openApp(id);hideStart()};list.appendChild(b)})});
  if(!list.children.length)list.appendChild(el('div','empty','no apps match'));
}
$('#tXp').onclick=function(){openApp('profile')};
$$('[data-open]').forEach(function(b){});

/* small markdown-ish for posts/lessons */
function md(t){t=esc(t);
  var keep=[];function stash(h){keep.push(h);return '\u0000'+(keep.length-1)+'\u0000'}   // code is set aside so * and _ inside it are never styled
  t=t.replace(/```([\s\S]*?)```/g,function(m,c){return stash('<pre>'+c.replace(/^\n/,'')+'</pre>')});
  t=t.replace(/`([^`]+)`/g,function(m,c){return stash('<code>'+c+'</code>')});
  t=t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  t=t.replace(/(^|[\s(>])\*([^*\s][^*\n]*?)\*(?=$|[\s).,;:!?<])/g,'$1<i>$2</i>');
  t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return t.replace(/\u0000(\d+)\u0000/g,function(m,i){return keep[+i]});
}
function ago(ts){var s=(now()-ts)/1000;if(s<60)return'now';if(s<3600)return(s/60|0)+'m';if(s<86400)return(s/3600|0)+'h';return (s/86400|0)+'d'}
function avatar(handle,color){var c=safeColor(color);return '<span class="av" style="background:'+c+'">'+esc((handle||'?')[0].toUpperCase())+'</span>'}
</script>
